name: Reusable Python release evidence

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.12"
      working-directory:
        type: string
        required: false
        default: "."
      artifact-name:
        type: string
        required: false
        default: "python-release-candidate"
      expected-version:
        type: string
        required: false
        default: ""
      enable-attestations:
        type: boolean
        required: false
        default: true
      retention-days:
        type: number
        required: false
        default: 14

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Verify locked project and tests
        run: |
          uv sync --locked --all-groups --all-extras
          uv run --locked pytest
      - name: Build publishable distributions
        run: uv build --no-sources --out-dir release/dist
      - name: Validate artifacts and install the wheel
        shell: python
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          import email, json, os, pathlib, subprocess, tarfile, zipfile

          root = pathlib.Path("release")
          wheels = sorted((root / "dist").glob("*.whl"))
          sdists = sorted((root / "dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("release evidence requires exactly one wheel and one .tar.gz sdist")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              wheel_metadata = email.message_from_bytes(archive.read(names[0]))
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = [name for name in archive.getnames() if name.count("/") == 1 and name.endswith("/PKG-INFO")]
              if len(names) != 1:
                  raise SystemExit("sdist must contain exactly one top-level PKG-INFO file")
              member = archive.extractfile(names[0])
              if member is None:
                  raise SystemExit("sdist PKG-INFO could not be read")
              sdist_metadata = email.message_from_bytes(member.read())

          package = wheel_metadata["Name"]
          version = wheel_metadata["Version"]
          if not package or not version:
              raise SystemExit("built artifacts must declare package name and version")
          if (sdist_metadata["Name"], sdist_metadata["Version"]) != (package, version):
              raise SystemExit("wheel and sdist package identity must match")
          if sdist_metadata.get("Requires-Python") != wheel_metadata.get("Requires-Python"):
              raise SystemExit("wheel and sdist Requires-Python metadata must match")
          if version == "0.0.0":
              raise SystemExit("placeholder version 0.0.0 cannot produce release evidence")
          expected = os.environ.get("EXPECTED_VERSION", "").strip()
          if expected and expected != version:
              raise SystemExit(f"expected version {expected} does not match artifact version {version}")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ.get("GITHUB_REF_NAME") != f"v{version}":
              raise SystemExit(f"tag must be v{version}")

          extras = sorted(set(wheel_metadata.get_all("Provides-Extra", [])))
          subprocess.run(["uv", "venv", ".release-venv"], check=True)
          subprocess.run(
              ["uv", "export", "--locked", "--all-extras", "--no-dev", "--no-emit-project", "--format", "requirements-txt", "--no-hashes", "--output-file", "release/runtime-constraints.txt"],
              check=True,
          )
          install_target = str(wheels[0]) + (f"[{','.join(extras)}]" if extras else "")
          subprocess.run(
              ["uv", "pip", "install", "--python", ".release-venv/bin/python", "--constraint", "release/runtime-constraints.txt", install_target],
              check=True,
          )
          installed = subprocess.check_output(
              [".release-venv/bin/python", "-c", f"import importlib.metadata; print(importlib.metadata.version({package!r}))"],
              text=True,
          ).strip()
          if installed != version:
              raise SystemExit("installed wheel version does not match artifact metadata")
          (root / "package-metadata.json").write_text(
              json.dumps(
                  {
                      "name": package,
                      "version": version,
                      "requires_python": wheel_metadata.get("Requires-Python"),
                      "extras": extras,
                      "wheel": wheels[0].name,
                      "sdist": sdists[0].name,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
      - name: Generate artifact-installed runtime SBOM
        run: |
          uv run --locked --group release cyclonedx-py environment .release-venv/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible \
            --output-format JSON \
            --output-file release/sbom.cdx.json
      - name: Generate checksums and evidence manifest
        shell: python
        run: |
          import hashlib, json, os, pathlib, platform

          root = pathlib.Path("release")
          metadata = json.loads((root / "package-metadata.json").read_text(encoding="utf-8"))
          files = sorted(path for path in (root / "dist").iterdir() if path.is_file())
          artifacts = [
              {
                  "path": path.relative_to(root).as_posix(),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
              for path in files
          ]
          (root / "SHA256SUMS").write_text(
              "".join(f"{row['sha256']}  {row['path']}\n" for row in artifacts),
              encoding="utf-8",
          )
          sbom_hash = hashlib.sha256((root / "sbom.cdx.json").read_bytes()).hexdigest()
          (root / "release-manifest.json").write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "package": metadata,
                      "commit": os.environ.get("GITHUB_SHA"),
                      "ref": os.environ.get("GITHUB_REF"),
                      "event": os.environ.get("GITHUB_EVENT_NAME"),
                      "python": platform.python_version(),
                      "artifacts": artifacts,
                      "sbom": {"path": "sbom.cdx.json", "sha256": sbom_hash},
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/release/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Attest build provenance
        if: inputs.enable-attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ inputs.working-directory }}/release/SHA256SUMS
      - name: Attest SBOM
        if: inputs.enable-attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ inputs.working-directory }}/release/SHA256SUMS
          sbom-path: ${{ inputs.working-directory }}/release/sbom.cdx.json
